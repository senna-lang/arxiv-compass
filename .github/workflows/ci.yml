name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protect-daily-data:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prevent daily JSON deletion
        run: |
          set -euo pipefail

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            echo "::error::Cannot determine the base commit for data deletion checks."
            exit 1
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${BASE_SHA}" || {
              echo "::error::Cannot fetch base commit ${BASE_SHA}; refusing to skip daily data deletion checks."
              exit 1
            }
          fi

          deleted_files="$(
            git diff --name-status "${BASE_SHA}" "${HEAD_SHA}" -- 'data/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].json' |
              awk '$1 == "D" { print $2 }'
          )"

          if [[ -n "${deleted_files}" ]]; then
            echo "::error::Daily JSON files must not be deleted:"
            echo "${deleted_files}"
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          cache: true
      - run: bun install --frozen-lockfile
      - run: npx tsc --noEmit

  astro-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          pytest scripts/tests/ \
            --ignore=scripts/tests/test_parse.py \
            --ignore=scripts/tests/test_map.py \
            --ignore=scripts/tests/test_recommend.py

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install ruff
      - run: ruff check scripts/
      - run: python -m py_compile scripts/*.py
